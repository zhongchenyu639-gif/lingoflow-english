name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest permissions, icon, and Gradle options
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import shutil

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic="true"' not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          for perm in (
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ):
              if perm not in text:
                  text = text.replace("</manifest>", f'    <uses-permission android:name="{perm}" />\n</manifest>', 1)
          manifest.write_text(text, encoding="utf-8")

          gradle_file = Path("android/app/build.gradle")
          if gradle_file.is_file():
              g = gradle_file.read_text(encoding="utf-8")
              if "noCompress" not in g and "android {" in g:
                  g = g.replace("android {\n", "android {\n    aaptOptions {\n        noCompress 'pak', 'mp3'\n    }\n", 1)
                  gradle_file.write_text(g, encoding="utf-8")

          gradle_props = Path("android/gradle.properties")
          if gradle_props.is_file():
              import re as _re
              gp = gradle_props.read_text(encoding="utf-8")
              if "org.gradle.jvmargs=" in gp:
                  gp = _re.sub(r"org\.gradle\.jvmargs=.*", "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8", gp)
              else:
                  gp += "\norg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\n"
              gradle_props.write_text(gp, encoding="utf-8")

          logo = Path("frontend/assets/lingoflow.png")
          if logo.is_file():
              res_root = Path("android/app/src/main/res")
              for mip in res_root.glob("mipmap-*"):
                  for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      dst = mip / name
                      if dst.is_file():
                          shutil.copy2(logo, dst)

          main_act = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if main_act:
              pkg_line = next((ln for ln in main_act.read_text(encoding="utf-8").splitlines() if ln.startswith("package ")), "package com.lingoflow.english;")
              main_act.write_text(
                  pkg_line + "\n\n"
                  "import android.Manifest;\n"
                  "import android.content.pm.PackageManager;\n"
                  "import android.os.Bundle;\n"
                  "import android.speech.tts.TextToSpeech;\n"
                  "import android.speech.tts.UtteranceProgressListener;\n"
                  "import android.webkit.JavascriptInterface;\n"
                  "import androidx.core.app.ActivityCompat;\n"
                  "import androidx.core.content.ContextCompat;\n"
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import java.util.Locale;\n"
                  "import java.util.concurrent.atomic.AtomicInteger;\n\n"
                  "public class MainActivity extends BridgeActivity {\n"
                  "    private TextToSpeech tts;\n"
                  "    private volatile boolean ttsReady = false;\n"
                  "    private final AtomicInteger seqGen = new AtomicInteger(0);\n\n"
                  "    @Override\n"
                  "    public void onCreate(Bundle savedInstanceState) {\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)\n"
                  "                != PackageManager.PERMISSION_GRANTED) {\n"
                  "            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);\n"
                  "        }\n"
                  "        tts = new TextToSpeech(this, status -> {\n"
                  "            if (status == TextToSpeech.SUCCESS) {\n"
                  "                ttsReady = true;\n"
                  "                tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {\n"
                  "                    @Override public void onStart(String id) {}\n"
                  "                    @Override public void onDone(String id) { notifyDone(id, false); }\n"
                  "                    @Override public void onError(String id) { notifyDone(id, false); }\n"
                  "                });\n"
                  "            }\n"
                  "        });\n"
                  "        if (getBridge() != null && getBridge().getWebView() != null) {\n"
                  "            getBridge().getWebView().addJavascriptInterface(new TtsBridge(), \"AndroidTtsBridge\");\n"
                  "        }\n"
                  "    }\n\n"
                  "    private void notifyDone(String id, boolean stopped) {\n"
                  "        if (getBridge() == null || getBridge().getWebView() == null) return;\n"
                  "        getBridge().getWebView().post(() ->\n"
                  "            getBridge().getWebView().evaluateJavascript(\n"
                  "                \"if(window.__onAndroidTtsDone)window.__onAndroidTtsDone(\" + id + \",\" + stopped + \");\",\n"
                  "                null\n"
                  "            )\n"
                  "        );\n"
                  "    }\n\n"
                  "    public class TtsBridge {\n"
                  "        @JavascriptInterface\n"
                  "        public int speak(String text, float rate, String lang) {\n"
                  "            if (!ttsReady || tts == null || text == null || text.trim().isEmpty()) return 0;\n"
                  "            int seq = seqGen.incrementAndGet();\n"
                  "            String low = lang == null ? \"en-us\" : lang.toLowerCase(Locale.ROOT);\n"
                  "            Locale loc = low.startsWith(\"zh\") ? Locale.SIMPLIFIED_CHINESE : (low.startsWith(\"en-gb\") ? Locale.UK : Locale.US);\n"
                  "            tts.setLanguage(loc);\n"
                  "            tts.setSpeechRate(Math.max(0.5f, Math.min(2.0f, rate)));\n"
                  "            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, String.valueOf(seq));\n"
                  "            return seq;\n"
                  "        }\n\n"
                  "        @JavascriptInterface\n"
                  "        public void stop() {\n"
                  "            if (tts != null) tts.stop();\n"
                  "        }\n"
                  "    }\n\n"
                  "    @Override\n"
                  "    public void onDestroy() {\n"
                  "        if (tts != null) { tts.stop(); tts.shutdown(); }\n"
                  "        super.onDestroy();\n"
                  "    }\n"
                  "}\n",
                  encoding="utf-8",
              )
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare LingoFlow-Android.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LingoFlow-Android.apk
          ls -lh LingoFlow-Android.apk
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("LingoFlow-Android.apk") as zf:
              names = set(zf.namelist())
          for req in ("assets/public/styles.css", "assets/public/app.js", "assets/public/seed_bundle.js", "assets/public/storage.js"):
              assert req in names, f"Missing {req} in APK"
          for code in ("us", "gb", "zh"):
              paks = [n for n in names if n.startswith(f"assets/public/voice_pak/{code}/") and n.endswith(".pak")]
              assert len(paks) == 256, f"Expected 256 .pak files for {code}, got {len(paks)}"
          print("APK asset verification passed: 256x3 voice_pak + core frontend files present.")
          EOF

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-Android-apk
          path: LingoFlow-Android.apk

      - name: Publish Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LingoFlow-Android.apk
          name: LingoFlow ${{ github.ref_name }}
          body: "LingoFlow 英语学习软件（内置云端声音克隆 + 安卓 APK）"
