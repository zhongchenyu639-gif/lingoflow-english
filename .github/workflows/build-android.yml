name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest permissions and cleartext support
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic="true"' not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if "android.permission.INTERNET" not in text:
              text = text.replace("</manifest>", '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>', 1)
          manifest.write_text(text, encoding="utf-8")
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare LingoFlow-Android.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LingoFlow-Android.apk
          ls -lh LingoFlow-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-Android-apk
          path: LingoFlow-Android.apk

      - name: Publish Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LingoFlow-Android.apk
          name: LingoFlow ${{ github.ref_name }}
          body: "LingoFlow 英语学习软件（内置云端声音克隆 + 安卓 APK）"
