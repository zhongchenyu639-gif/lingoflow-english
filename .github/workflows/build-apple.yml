name: Build Apple Apps (iOS IPA & macOS DMG)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iPhone / iPad (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync iOS Xcode project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build unsigned iOS Release app
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios/build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios/build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Package LingoFlow-iOS.ipa
        run: |
          rm -rf Payload LingoFlow-iOS.ipa
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry LingoFlow-iOS.ipa Payload
          ls -lh LingoFlow-iOS.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-iOS-ipa
          path: LingoFlow-iOS.ipa

  build-macos-dmg:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Build LingoFlow.app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name LingoFlow \
            --add-data "frontend:frontend" \
            --collect-all webview \
            app.py

      - name: Package LingoFlow-macOS.dmg
        run: |
          hdiutil create -volname "LingoFlow" -srcfolder dist/LingoFlow.app -ov -format UDZO LingoFlow-macOS.dmg
          ls -lh LingoFlow-macOS.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-macOS-dmg
          path: LingoFlow-macOS.dmg
